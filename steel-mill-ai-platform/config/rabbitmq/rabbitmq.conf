# RabbitMQ Configuration for Steel Mill AI Platform Local Development

# Network and clustering
listeners.tcp.default = 5672
management.tcp.port = 15672

# Memory and disk management
vm_memory_high_watermark.relative = 0.6
disk_free_limit.relative = 2.0

# Queue settings
default_vhost = steelmill
default_user = steelmill
default_pass = steelmill123
default_permissions.configure = .*
default_permissions.read = .*
default_permissions.write = .*

# Management plugin
management.listener.port = 15672
management.listener.ssl = false

# Logging
log.console = true
log.console.level = info
log.file = false

# SSL/TLS (disabled for local development)
ssl_options.verify = verify_none
ssl_options.fail_if_no_peer_cert = false

# Message TTL and size limits
max_message_size = 134217728

# Connection limits
connection_max = 1000
channel_max = 1000

# Queue mirroring policy (for HA in production)
# ha-mode = all
# ha-sync-mode = automatic