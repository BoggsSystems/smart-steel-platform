version: '3.8'

services:
  # ================================
  # DATABASE SERVICES
  # ================================
  
  # MongoDB as primary document database (Cosmos DB alternative for Mac)
  mongodb:
    image: mongo:7
    container_name: steel-mill-mongodb
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=steelmill
      - MONGO_INITDB_ROOT_PASSWORD=steelmill123
      - MONGO_INITDB_DATABASE=steelmill
    volumes:
      - mongodb-data:/data/db
      - ./scripts/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    networks:
      - steel-mill-network
    healthcheck:
      test: ["CMD", "mongo", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for caching and session storage
  redis:
    image: redis:7-alpine
    container_name: steel-mill-redis
    ports:
      - "6379:6379"
    command: redis-server --requirepass steelmill123
    volumes:
      - redis-data:/data
    networks:
      - steel-mill-network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # InfluxDB for time-series data
  influxdb:
    image: influxdb:2.7-alpine
    container_name: steel-mill-influxdb
    ports:
      - "8086:8086"
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=steelmill
      - DOCKER_INFLUXDB_INIT_PASSWORD=steelmill123
      - DOCKER_INFLUXDB_INIT_ORG=steelmill-org
      - DOCKER_INFLUXDB_INIT_BUCKET=sensor-data
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=steelmill-super-secret-token
    volumes:
      - influxdb-data:/var/lib/influxdb2
      - influxdb-config:/etc/influxdb2
    networks:
      - steel-mill-network
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ================================
  # MESSAGE BROKERS
  # ================================

  # Zookeeper for Kafka
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: steel-mill-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_INIT_LIMIT: 5
      ZOOKEEPER_SYNC_LIMIT: 2
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-logs:/var/lib/zookeeper/log
    networks:
      - steel-mill-network
    healthcheck:
      test: ["CMD", "bash", "-c", "echo 'ruok' | nc localhost 2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Apache Kafka (alternative to Azure Event Hub)
  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: steel-mill-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
      - "9101:9101"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_JMX_PORT: 9101
      KAFKA_JMX_HOSTNAME: localhost
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_DELETE_TOPIC_ENABLE: 'true'
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - steel-mill-network
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 5

  # RabbitMQ (alternative to Azure Service Bus)
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: steel-mill-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=steelmill
      - RABBITMQ_DEFAULT_PASS=steelmill123
      - RABBITMQ_DEFAULT_VHOST=steelmill
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./config/rabbitmq:/etc/rabbitmq
    networks:
      - steel-mill-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ================================
  # MONITORING & OBSERVABILITY
  # ================================

  # Prometheus for metrics collection
  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: steel-mill-prometheus
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - steel-mill-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Grafana for visualization
  grafana:
    image: grafana/grafana:10.1.0
    container_name: steel-mill-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=steelmill123
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards
    networks:
      - steel-mill-network
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Jaeger for distributed tracing
  jaeger:
    image: jaegertracing/all-in-one:1.50
    container_name: steel-mill-jaeger
    ports:
      - "16686:16686"
      - "14268:14268"
      - "14250:14250"
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    networks:
      - steel-mill-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:16686/"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ================================
  # ML PIPELINE SERVICES
  # ================================

  # MLflow for experiment tracking
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.7.1
    container_name: steel-mill-mlflow
    ports:
      - "5000:5000"
    command: >
      mlflow server
      --backend-store-uri sqlite:///mlflow/mlflow.db
      --artifacts-root /mlflow/artifacts
      --host 0.0.0.0
      --port 5000
    volumes:
      - mlflow-data:/mlflow
    networks:
      - steel-mill-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Jupyter for ML development
  jupyter:
    image: jupyter/scipy-notebook:python-3.11
    container_name: steel-mill-jupyter
    ports:
      - "8888:8888"
    environment:
      - JUPYTER_ENABLE_LAB=yes
      - JUPYTER_TOKEN=steelmill123
    volumes:
      - ./ml-pipeline:/home/jovyan/work
      - jupyter-data:/home/jovyan
    networks:
      - steel-mill-network
    user: root
    command: >
      bash -c "
      pip install mlflow scikit-learn pandas numpy matplotlib seaborn plotly &&
      start-notebook.sh --NotebookApp.token='steelmill123' --NotebookApp.password='' --allow-root
      "

  # ================================
  # DEVELOPMENT TOOLS
  # ================================

  # Kafka UI for Kafka management
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: steel-mill-kafka-ui
    depends_on:
      - kafka
    ports:
      - "8080:8080"
    environment:
      - KAFKA_CLUSTERS_0_NAME=steel-mill-cluster
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:29092
      - KAFKA_CLUSTERS_0_ZOOKEEPER=zookeeper:2181
    networks:
      - steel-mill-network

  # MongoDB Express for MongoDB management
  mongo-express:
    image: mongo-express:1.0.0-alpha
    container_name: steel-mill-mongo-express
    restart: unless-stopped
    ports:
      - "8082:8081"
    environment:
      - ME_CONFIG_MONGODB_ADMINUSERNAME=steelmill
      - ME_CONFIG_MONGODB_ADMINPASSWORD=steelmill123
      - ME_CONFIG_MONGODB_URL=mongodb://steelmill:steelmill123@mongodb:27017/
      - ME_CONFIG_BASICAUTH_USERNAME=admin
      - ME_CONFIG_BASICAUTH_PASSWORD=steelmill123
    depends_on:
      - mongodb
    networks:
      - steel-mill-network

  # Redis Commander for Redis management
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: steel-mill-redis-commander
    hostname: redis-commander
    ports:
      - "8083:8081"
    environment:
      - REDIS_HOSTS=local:redis:6379:0:steelmill123
      - HTTP_USER=admin
      - HTTP_PASSWORD=steelmill123
    depends_on:
      - redis
    networks:
      - steel-mill-network

  # Seq for structured logging
  seq:
    image: datalust/seq:latest
    container_name: steel-mill-seq
    ports:
      - "5341:80"
    environment:
      - ACCEPT_EULA=Y
      - SEQ_FIRSTRUN_ADMINPASSWORDHASH=QH+AudpU5q3FrFfvIZCT7gKjbHOnPp08LqiVd7vD+AelO8LW9h+q/i6d4zEYGWiM2Io+jBAwWjhWj12z9QA5y/YQ== # Password: steelmill123
    volumes:
      - seq-data:/data
    networks:
      - steel-mill-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3

# ================================
# NETWORKS & VOLUMES
# ================================

networks:
  steel-mill-network:
    driver: bridge
    name: steel-mill-network

volumes:
  mongodb-data:
    name: steel-mill-mongodb-data
  redis-data:
    name: steel-mill-redis-data
  influxdb-data:
    name: steel-mill-influxdb-data
  influxdb-config:
    name: steel-mill-influxdb-config
  zookeeper-data:
    name: steel-mill-zookeeper-data
  zookeeper-logs:
    name: steel-mill-zookeeper-logs
  kafka-data:
    name: steel-mill-kafka-data
  rabbitmq-data:
    name: steel-mill-rabbitmq-data
  prometheus-data:
    name: steel-mill-prometheus-data
  grafana-data:
    name: steel-mill-grafana-data
  mlflow-data:
    name: steel-mill-mlflow-data
  jupyter-data:
    name: steel-mill-jupyter-data
  seq-data:
    name: steel-mill-seq-data