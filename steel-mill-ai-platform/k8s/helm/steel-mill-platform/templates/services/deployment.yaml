{{- range $serviceName, $service := .Values.services }}
{{- if $service.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $service.name }}
  namespace: {{ $.Values.platform.namespace }}
  labels:
    {{- include "steel-mill-platform.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $serviceName }}
spec:
  replicas: {{ if $.Values.development.enabled }}1{{ else }}{{ $service.replicas }}{{ end }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  selector:
    matchLabels:
      {{- include "steel-mill-platform.selectorLabels" $ | nindent 6 }}
      app.kubernetes.io/component: {{ $serviceName }}
  template:
    metadata:
      labels:
        {{- include "steel-mill-platform.selectorLabels" $ | nindent 8 }}
        app.kubernetes.io/component: {{ $serviceName }}
        version: {{ $.Chart.AppVersion }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ $service.port }}"
        prometheus.io/path: "/metrics"
        sidecar.istio.io/inject: "{{ $.Values.serviceMesh.enabled }}"
    spec:
      serviceAccountName: {{ include "steel-mill-platform.serviceAccountName" $ }}
      securityContext:
        {{- toYaml $.Values.security.podSecurityContext | nindent 8 }}
      containers:
      - name: {{ $serviceName }}
        image: "{{ $.Values.image.registry }}/{{ $service.image }}"
        imagePullPolicy: {{ $.Values.image.pullPolicy }}
        ports:
        - name: http
          containerPort: {{ $service.port }}
          protocol: TCP
        - name: metrics
          containerPort: 9090
          protocol: TCP
        env:
        - name: ASPNETCORE_ENVIRONMENT
          value: {{ $.Values.platform.environment | title }}
        - name: ASPNETCORE_URLS
          value: "http://+:{{ $service.port }}"
        - name: CosmosDb__ConnectionString
          valueFrom:
            secretKeyRef:
              name: {{ $.Values.azure.cosmosDb.secretName }}
              key: connectionString
        - name: EventHub__ConnectionString
          valueFrom:
            secretKeyRef:
              name: {{ $.Values.azure.eventHub.secretName }}
              key: connectionString
        - name: ServiceBus__ConnectionString
          valueFrom:
            secretKeyRef:
              name: {{ $.Values.azure.serviceBus.secretName }}
              key: connectionString
        - name: Redis__ConnectionString
          valueFrom:
            secretKeyRef:
              name: redis-secret
              key: redis-password
        livenessProbe:
          httpGet:
            path: /health/live
            port: http
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health/ready
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 30
        {{- if $.Values.development.enabled }}
        resources:
          requests:
            memory: {{ $.Values.development.resources.requests.memory }}
            cpu: {{ $.Values.development.resources.requests.cpu }}
          limits:
            memory: {{ $.Values.development.resources.limits.memory }}
            cpu: {{ $.Values.development.resources.limits.cpu }}
        {{- else }}
        resources:
          requests:
            memory: {{ $service.resources.requests.memory }}
            cpu: {{ $service.resources.requests.cpu }}
          limits:
            memory: {{ $service.resources.limits.memory }}
            cpu: {{ $service.resources.limits.cpu }}
        {{- end }}
        securityContext:
          {{- toYaml $.Values.security.containerSecurityContext | nindent 10 }}
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: logs
          mountPath: /app/logs
      volumes:
      - name: tmp
        emptyDir: {}
      - name: logs
        emptyDir: {}
      {{- with $.Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      nodeSelector:
        kubernetes.io/os: linux
      tolerations: []
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app.kubernetes.io/component
                  operator: In
                  values:
                  - {{ $serviceName }}
              topologyKey: kubernetes.io/hostname
{{- end }}
{{- end }}